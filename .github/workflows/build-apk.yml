name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'project/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH

      - name: Install packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Persistent debug keystore
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/.ctoa-debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CtoA Debug,O=CtoA,C=US"
            git config user.email "ctoa-bot@users.noreply.github.com"
            git config user.name "CtoA Bot"
            git add -f "$KEYSTORE"
            git commit -m "CtoA: persist debug keystore [skip ci]" || true
            git push || true
          fi
          mkdir -p ~/.android
          cp "$KEYSTORE" ~/.android/debug.keystore

      - name: local.properties
        working-directory: project
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK uniquely
        if: success()
        id: rename
        working-directory: project/app/build/outputs/apk/debug
        run: |
          APP_NAME=$(cat ../../../../../.app-info 2>/dev/null | tr -d '\n' || echo "Browser_88")
          APP_NAME=$(echo "$APP_NAME" | tr ' ' '_' | tr -cd 'A-Za-z0-9._-')
          [ -z "$APP_NAME" ] && APP_NAME="Browser_88"
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' ../../../build.gradle 2>/dev/null | head -1 || echo "1.0")
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NEW_NAME="${APP_NAME}-v${VERSION}-${SHA}.apk"
          for f in *.apk; do
            [ -f "$f" ] && mv "$f" "$NEW_NAME"
          done
          echo "apk_path=project/app/build/outputs/apk/debug/${NEW_NAME}" >> $GITHUB_OUTPUT

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          files: ${{ steps.rename.outputs.apk_path }}
          make_latest: true

      - name: Cleanup old releases
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 \
            --json tagName --jq '.[10:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" \
                --repo ${{ github.repository }} --yes --cleanup-tag || true
            done
